[project]
name = "mission-control-backend"
version = "0.1.0"
description = "FastAPI backend for the Mission Control touch-first household calendar kiosk"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "pydantic>=2.9,<3.0",
  "pydantic-settings>=2.6,<3.0",
  "httpx>=0.27,<1.0",
  "msal>=1.31,<2.0",
  "segno>=1.6,<2.0",
  "google-genai>=2.21,<3.0",
  # Upstream client for the Azure voice relay (app/voice/relay.py). Already
  # present transitively via uvicorn[standard]; pinned here because we import it.
  "websockets>=13,<17",
  # Local-webcam presence motion detection (app/presence/sources/local_camera.py,
  # docs/camera-support-plan.md). `-headless` drops the GUI (Qt/highgui) build
  # this backend never uses (no imshow, no windows) — smaller wheel, fewer
  # native deps, same VideoCapture / background-subtraction / contour API.
  # BSD-3-Clause; no model weights (MOG2 is a classical, non-trained algorithm)
  # so there is no separate weights licence to review — see docs/credits.md.
  "opencv-python-headless>=4.9,<5.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9.0",
  "pytest-asyncio>=0.24,<1.0",
  "respx>=0.21,<1.0",
  "ruff>=0.6",
]
# The native Azure Speech SDK — two independent, separately-configured
# consumers: the `azure` wake-word provider (an offline, on-device
# `KeywordRecognizer` against a custom `.table`, no key, no network — mic
# audio from `WS /api/voice/wake/azure`, app/voice/wake_azure.py) and the
# `azure` notes-dictation provider (a real-time cloud `SpeechRecognizer`
# session, needs an Azure Speech resource key — mic audio from
# `WS /api/notes/dictate/azure`, app/notes_stt_azure.py). Left out of the core
# deps so the default paths (`openwakeword`, `gemini`) never pull a native SDK —
# `pip install -e '.[azure-wake]'` to enable either.
azure-wake = [
  "azure-cognitiveservices-speech>=1.44,<2.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI dependency-injection markers are evaluated once and are safe as defaults.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Path"]
